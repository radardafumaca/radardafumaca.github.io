name: Atualizar e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a mais nova substitui a que estiver na fila.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar focos
        run: python scripts/update_data.py
        env:
          # Opcional: sem o secret, o script usa os arquivos abertos de 48 h.
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      - name: Montar o site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/focos.json data/cidades.json _site/data/
          # a grade (vento, temperatura, ar) é opcional: se a Open-Meteo falhar, o site sai sem ela
          if [ -f data/grade.json ]; then cp data/grade.json _site/data/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
