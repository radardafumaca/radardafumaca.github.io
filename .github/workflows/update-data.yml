name: Atualizar e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  # contents e actions de escrita: só para o passo que mantém a rotina ativa
  contents: write
  actions: write
  pages: write
  id-token: write

# Uma publicação por vez; a mais nova substitui a que estiver na fila.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Endereço do site como está configurado no GitHub Pages (github.io ou domínio próprio).
      - id: pages
        uses: actions/configure-pages@v6
      - name: Guardar os dados publicados (reserva se a FIRMS ou a Open-Meteo falharem)
        run: |
          # -L: com domínio próprio, o endereço antigo redireciona para o novo
          site="${{ steps.pages.outputs.base_url }}/data"
          curl -sfL --retry 3 "$site/grade.json" -o data/grade.prev.json || true
          curl -sfL --retry 3 "$site/focos.json" -o data/focos.prev.json || true
          curl -sfL --retry 3 "$site/sensores.json" -o data/sensores.prev.json || true
          curl -sfL --retry 5 "$site/historico.json" -o data/historico.prev.json || true
          curl -sfL --retry 3 "$site/bairros.json" -o data/bairros.prev.json || true
          curl -sfL --retry 5 "$site/anos.json" -o data/anos.prev.json || true
      - name: Baixar focos
        run: python scripts/update_data.py
        env:
          # Opcional: sem o secret, o script usa os arquivos abertos de 48 h.
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          PURPLEAIR_KEY: ${{ secrets.PURPLEAIR_KEY }}
      # Focos do mês comparados com os mesmos dias dos anos anteriores (arquivo baixado uma vez por mês).
      - name: Comparar com outros anos
        run: python scripts/anos.py || echo "comparação não atualizada; o site segue"
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      - name: Montar o site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/focos.json data/cidades.json _site/data/
          # a grade (vento, temperatura, ar) é opcional: se a Open-Meteo falhar, o site sai sem ela
          if [ -f data/grade.json ]; then cp data/grade.json _site/data/; fi
          if [ -f data/sensores.json ]; then cp data/sensores.json _site/data/; fi
          if [ -f data/historico.json ]; then cp data/historico.json _site/data/; fi
          if [ -f data/bairros.json ]; then cp data/bairros.json _site/data/; fi
          if [ -f data/anos.json ]; then cp data/anos.json _site/data/; fi
          # para buscadores: o que pode ser indexado e quando a página mudou
          base="${{ steps.pages.outputs.base_url }}/"
          printf 'User-agent: *\nAllow: /\nSitemap: %ssitemap.xml\n' "$base" > _site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>%s</loc><lastmod>%s</lastmod><changefreq>hourly</changefreq></url>\n</urlset>\n' "$base" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/sitemap.xml
      # Prévia do link (WhatsApp, redes): imagem e textos com os números do momento.
      # Se falhar, o site sai com a prévia padrão.
      - name: Prévia para compartilhar
        run: |
          pip install -q "pillow>=11,<13" && python scripts/build_preview.py _site "${{ steps.pages.outputs.base_url }}/" || echo "prévia não gerada; seguindo com a padrão"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
      # O GitHub desliga rotinas agendadas de repositórios sem commit há 60 dias; como esta
      # Action não faz commit dos dados, o site congelaria sem aviso. Aos 40 dias, reativa a
      # rotina pela API (método da keepalive-workflow); aos 50, um commit vazio zera o prazo.
      - name: Manter a rotina agendada ativa
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dias=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "último commit há $dias dias"
          if [ "$dias" -ge 40 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"
          fi
          if [ "$dias" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "manutenção: manter a rotina agendada ativa"
            git push
          fi
